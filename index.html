<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Euclid 76 Reunion Videos</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#020812;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1536px;margin:auto;position:relative;line-height:0}.hero{width:100%;height:auto}.show{position:absolute;top:75.5%;height:16.5%;z-index:2;border-radius:14px}.main{left:4.5%;width:44%}.rock{left:51.5%;width:44%}.show:hover,.show:focus{outline:4px solid rgba(255,215,100,.9);outline-offset:-4px;background:rgba(255,255,255,.04)}.hint{text-align:center;padding:14px;color:#d8c486}dialog{width:min(1100px,94vw);padding:0;border:1px solid #b88a2c;border-radius:12px;background:#030914;color:#fff}dialog::backdrop{background:rgba(0,0,0,.88)}.head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#071a34}.head strong{color:#e0b64d;font-size:18px}.close{font-size:28px;border:0;background:transparent;color:white;cursor:pointer}.player{position:relative;padding-top:56.25%;background:#000}.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style></head>
<body><main class="wrap"><img class="hero" src="Euclid76Home.png" alt="Euclid High School Class of 1976 World Series of Rock 50th Reunion Video Collection">
<a class="show main" href="https://www.youtube.com/watch?v=50dbdgLqKPE" aria-label="Play Main Show" onclick="play(event,'Main Show','50dbdgLqKPE')"></a>
<a class="show rock" href="https://www.youtube.com/watch?v=puswpPBXWYE" aria-label="Play Rock Star Show" onclick="play(event,'Rock Star Show','puswpPBXWYE')"></a></main>
<div class="hint">Click either show to watch it here.</div>
<dialog id="dlg"><div class="head"><strong id="ttl"></strong><button class="close" onclick="closeVid()" aria-label="Close">×</button></div><div class="player"><iframe id="frm" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div></dialog>
<script>const d=document.getElementById('dlg'),f=document.getElementById('frm'),t=document.getElementById('ttl');function play(e,n,id){e.preventDefault();t.textContent=n;f.src='https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0';d.showModal()}function closeVid(){f.src='';d.close()}d.addEventListener('click',e=>{if(e.target===d)closeVid()});d.addEventListener('close',()=>f.src='');</script></body></html>
